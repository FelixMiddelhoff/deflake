name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test with coverage
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            dotnet test --configuration Release --no-build --logger "console;verbosity=detailed" --diag diagnostics.txt
          else
            dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage --logger "console;verbosity=detailed" --diag diagnostics.txt
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: diagnostics.txt

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check formatting
        run: dotnet format --verify-no-changes
